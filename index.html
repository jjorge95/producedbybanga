  <style>
    *, *::before, *::after {
      box-sizing: border-box;

      --white-dim: rgba(255,255,255,0.55);
      --gap: clamp(10px, 1.8svh, 22px);
      --section-gap: clamp(18px, 2.6svh, 30px);
      --touch-target: 44px;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      /* System font fallback renders immediately; Inter swaps in when loaded */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Right-click / drag protection */

      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    p, h1, h2, h3, span, a, footer {
      -webkit-user-select: text;
      -moz-user-select: text;
      user-select: text;
    }

    img {
      -webkit-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(74,127,165,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(10,15,26,0.9) 0%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 2.4svh, 28px) 24px clamp(24px, 3.2svh, 40px);
    }

    /* COVER ART */
    .cover-wrap {
      position: relative;
      width: min(340px, 80vw, 36svh);
      aspect-ratio: 1 / 1;
      margin-bottom: calc(var(--gap) * 1.4);
      overflow: hidden;
    }

    .cover-wrap::after {
      content: '';
      position: absolute;
      inset: -1px;
      border: 1px solid rgba(74,127,165,0.3);
      pointer-events: none;
    }

    .cover-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
      filter: contrast(1.05) saturate(0.9);
    }

    /* TITLE */
    .title-block {
      text-align: center;
      margin-bottom: var(--gap);
    }

    .artist-name {
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 2.5vw, 13px);
      font-weight: 500;
      letter-spacing: 0.28em;
      color: var(--blue-accent);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .song-title {
      font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: clamp(52px, min(22vw, 11svh), 148px);
      line-height: 0.88;
      letter-spacing: 0.04em;
      color: var(--white);
      margin-bottom: 10px;
    }

    .release-date {
      font-size: clamp(11px, 2.5vw, 13px);
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--white-dim);
    }

    /* CTA */
    .cta-wrap {
      margin-bottom: var(--section-gap);
    }

    .btn-presave {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--white);
      color: var(--black);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      width: 220px;
      justify-content: center;
      min-height: 48px;
      padding: 14px 18px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-presave:hover,
    .btn-presave:focus-visible {
      background: var(--blue-accent);
      color: var(--white);
      outline: none;
    }

    .btn-presave:focus-visible {
      outline: 2px solid var(--blue-accent);
      outline-offset: 4px;
    }

    /* PLATFORMS */
    .platforms {
      display: flex;
      align-items: center;
      column-gap: clamp(18px, 3vw, 28px);
      row-gap: 8px;
      margin-bottom: var(--section-gap);
      flex-wrap: wrap;
      justify-content: center;
    }

    .platform-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: var(--touch-target);
      padding: 10px 2px;
      text-decoration: none;
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.1em;
      transition: color 0.2s ease;
    }

    .platform-link:hover,
    .platform-link:focus-visible { color: var(--white-dim); }

    .platform-link:focus-visible {
      outline: 2px solid var(--blue-accent);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .platform-link svg {
      flex-shrink: 0;
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }

    .platform-link:hover svg { opacity: 1; }

    .divider {
      width: 1px;
      height: 12px;
      background: rgba(255,255,255,0.12);
    }

    /* SOCIAL */
    .social-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: clamp(20px, 2.8svh, 32px);
      flex-wrap: wrap;
      justify-content: center;

      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      text-decoration: none;
      color: rgba(255,255,255,0.5);
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    .social-link:hover,
    .social-link:focus-visible {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.28);
      color: #ffffff;
    }

    .social-link:focus-visible {
      outline: 2px solid var(--blue-accent);
      outline-offset: 3px;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.15);
      padding-top: var(--gap);
      border-top: 1px solid rgba(255,255,255,0.06);
      width: 160px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    @media (max-width: 480px) {
      .page {
        justify-content: flex-start;
        padding: 14px 18px 28px;
      }

      .cover-wrap {
        width: min(320px, 88vw, 38svh);
        margin-top: 2px;
      }

      .btn-presave {
        width: min(240px, 78vw);
        min-height: 50px;
      }

      .platforms {
        width: min(360px, 100%);
        column-gap: 18px;
        row-gap: 4px;
      }

      .platform-link {
        min-height: 44px;
        padding: 10px 4px;
      }

      .divider { display: none; }

      .social-link {
        width: 46px;
        height: 46px;
      }
    }

    @media (max-height: 760px) and (min-width: 481px) {
      .page {
        justify-content: flex-start;
        padding-top: 14px;
      }

      .cover-wrap {
        width: min(320px, 72vw, 34svh);
      }
    }
  </style>
</head>
