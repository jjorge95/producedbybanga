<head>

  <meta property="og:title" content="BANGA — TELLER" />
  <meta property="og:description" content="Debut single available September 25, 2026." />
  <meta property="og:type" content="music.song" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #000000;
      --navy-deep: #0A0F1A;
      --navy-mid: #1C2B3A;
      --blue-accent: #4A7FA5;
      --white: #FFFFFF;
      --white-dim: rgba(255,255,255,0.55);
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(74,127,165,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(10,15,26,0.9) 0%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 80px;
    }

    /* COVER ART */
    .cover-wrap {
      position: relative;
      width: min(420px, 88vw);
      aspect-ratio: 1 / 1;
      margin-bottom: 48px;
    }

    .cover-wrap::after {
      content: '';
      position: absolute;
      inset: -1px;
      border: 1px solid rgba(74,127,165,0.3);
      pointer-events: none;
    }

    .cover-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: contrast(1.05) saturate(0.9);
    }

    /* TITLE */
    .title-block {
      text-align: center;
      margin-bottom: 40px;
    }

    .artist-name {
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 2.5vw, 13px);
      font-weight: 500;
      letter-spacing: 0.28em;
      color: var(--blue-accent);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .song-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(72px, 22vw, 148px);
      line-height: 0.88;
      letter-spacing: 0.04em;
      color: var(--white);
      margin-bottom: 20px;
    }

    .release-date {
      font-size: clamp(12px, 2.8vw, 14px);
      font-weight: 300;
      letter-spacing: 0.18em;
      color: var(--white-dim);
    }

    /* CTA */
    .cta-wrap {
      margin-bottom: 52px;
    }

    .btn-presave {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--white);
      color: var(--black);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 16px 40px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-presave:hover,
    .btn-presave:focus-visible {
      background: var(--blue-accent);
      color: var(--white);
      outline: none;
    }

    .btn-presave:focus-visible {
      outline: 2px solid var(--blue-accent);
      outline-offset: 4px;
    }

    /* PLATFORMS */
    .platforms {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-bottom: 56px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .platform-link {
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      color: var(--white-dim);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.1em;
      transition: color 0.2s ease;
    }

    .platform-link:hover { color: var(--white); }

    .platform-link svg {
      flex-shrink: 0;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }

    .platform-link:hover svg { opacity: 1; }

    .divider {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,0.15);
    }

    /* SOCIAL — monochrome circular buttons */
    .social-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      text-decoration: none;
      color: rgba(255,255,255,0.6);
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    .social-link:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.3);
      color: #ffffff;
    }

    /* FOOTER */
    .footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.18);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 20px 72px;
        justify-content: flex-start;
        padding-top: 56px;
      }
      .cover-wrap {
        width: min(340px, 92vw);
        margin-bottom: 36px;
      }
      .platforms { gap: 20px; }
      .divider { display: none; }
    }
  </style>
</head>
